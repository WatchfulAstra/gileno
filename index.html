<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dark Room</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  html, body { margin:0; height:100%; background:#020203; overflow:hidden; touch-action:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; font-family:Georgia, 'Times New Roman', serif; color:#cfc6b0; }
  canvas { display:block; width:100%; height:100%; }
  #vignette { position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,.65) 100%); }
  #overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(2,2,3,.94); text-align:center; padding:24px; z-index:10; }
  #overlay h1 { font-weight:400; font-size:34px; letter-spacing:.04em; margin:0 0 10px; }
  #overlay p { max-width:340px; line-height:1.5; margin:6px 0; color:#9d957f; font-size:15px; }
  #enter { margin-top:22px; padding:14px 38px; font:inherit; font-size:18px; color:#e9dfc4; background:transparent;
    border:1px solid #6f6650; border-radius:2px; }
  #enter:active { background:#2a261c; }
  #loading { color:#6f6650; font-size:14px; margin-top:16px; }
  #joy { position:fixed; left:22px; bottom:26px; width:130px; height:130px; border-radius:50%;
    border:1px solid rgba(207,198,176,.3); background:rgba(207,198,176,.05); display:none; z-index:5; }
  #knob { position:absolute; left:50%; top:50%; width:54px; height:54px; margin:-27px 0 0 -27px; border-radius:50%;
    background:rgba(207,198,176,.25); border:1px solid rgba(207,198,176,.5); }
  .btn { position:fixed; width:62px; height:62px; border-radius:50%; display:none; align-items:center; justify-content:center;
    border:1px solid rgba(207,198,176,.4); background:rgba(207,198,176,.08); font-size:15px; color:#e9dfc4; z-index:5; }
  .btn.on { background:rgba(233,223,196,.28); }
  #bLight { right:24px; bottom:120px; }
  #bJump { right:24px; bottom:40px; }
  #bRun { right:100px; bottom:70px; }
  #hint { position:fixed; left:0; right:0; top:14px; text-align:center; font-size:13px; color:#8a8269; pointer-events:none; transition:opacity 2s; }
</style>
</head>
<body>
<div id="vignette"></div>
<div id="hint"></div>
<div id="joy"><div id="knob"></div></div>
<div class="btn" id="bLight">Light</div>
<div class="btn" id="bRun">Run</div>
<div class="btn" id="bJump">Jump</div>

<div id="overlay">
  <h1>The Dusty Room</h1>
  <p>Nobody has opened this room in years. You have a flashlight and not much else.</p>
  <p id="controlsTxt"></p>
  <button id="enter" disabled>Loading…</button>
  <div id="loading"></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
} }
</script>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
const $ = id => document.getElementById(id);
$('controlsTxt').textContent = isTouch
  ? 'Left thumb: move (push to the edge to run). Drag anywhere else: look. Buttons: flashlight, jump.'
  : 'WASD move, mouse look, Shift run, Space jump, F flashlight. Click to capture the mouse.';

/* ---------- renderer (kept light for low RAM) ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: !isTouch, powerPreference: 'default' });
const PR = Math.min(window.devicePixelRatio || 1, isTouch ? 1.5 : 2);
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020203);
scene.fog = new THREE.FogExp2(0x040405, 0.055);

const FOV = 72;
const camera = new THREE.PerspectiveCamera(FOV, innerWidth / innerHeight, 0.1, 40);
camera.rotation.order = 'YXZ';
scene.add(camera);

/* ---------- procedural textures (256px canvases, no downloads) ---------- */
const rnd = (a, b) => a + Math.random() * (b - a);
function makeTex(size, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 2;
  return t;
}
function speckle(g, s, n, light) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = light ? `rgba(255,240,220,${rnd(.02, .1)})` : `rgba(0,0,0,${rnd(.04, .2)})`;
    g.fillRect(rnd(0, s), rnd(0, s), rnd(1, 3), rnd(1, 3));
  }
}
function blotches(g, s, n, rgb, a, rmin, rmax) {
  for (let i = 0; i < n; i++) {
    const x = rnd(0, s), y = rnd(0, s), r = rnd(rmin, rmax);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(${rgb},${a})`); gr.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
}
const drawWood = (g, s) => {
  const n = 6, w = s / n;
  for (let i = 0; i < n; i++) {
    g.fillStyle = `hsl(${25 + rnd(-4, 4)},${rnd(25, 38)}%,${rnd(20, 31)}%)`;
    g.fillRect(i * w, 0, w, s);
    for (let k = 0; k < 14; k++) {
      g.strokeStyle = `rgba(0,0,0,${rnd(.06, .22)})`; g.lineWidth = rnd(.5, 1.5);
      const x = i * w + rnd(2, w - 2);
      g.beginPath(); g.moveTo(x, 0); g.bezierCurveTo(x + rnd(-3, 3), s * .3, x + rnd(-3, 3), s * .7, x + rnd(-2, 2), s); g.stroke();
    }
    g.fillStyle = 'rgba(0,0,0,.65)'; g.fillRect(i * w, 0, 2, s);
  }
  blotches(g, s, 6, '15,10,5', .35, 30, 80);
  speckle(g, s, 500, false); speckle(g, s, 250, true);
};
const drawWall = (g, s) => {
  g.fillStyle = '#4b4b44'; g.fillRect(0, 0, s, s);
  blotches(g, s, 14, '20,18,10', .35, 30, 110);
  blotches(g, s, 8, '90,90,80', .15, 20, 60);
  const gr = g.createLinearGradient(0, s, 0, s * .45);
  gr.addColorStop(0, 'rgba(10,8,4,.65)'); gr.addColorStop(1, 'rgba(10,8,4,0)');
  g.fillStyle = gr; g.fillRect(0, 0, s, s);
  g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 1;
  for (let i = 0; i < 3; i++) {
    let x = rnd(0, s), y = rnd(0, s * .5); g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 7; k++) { x += rnd(-8, 8); y += rnd(8, 20); g.lineTo(x, y); }
    g.stroke();
  }
  speckle(g, s, 700, false); speckle(g, s, 300, true);
};
const drawRug = (g, s) => {
  g.fillStyle = '#4a1a1a'; g.fillRect(0, 0, s, s);
  g.strokeStyle = '#8a6a3a'; g.lineWidth = 6; g.strokeRect(12, 12, s - 24, s - 24);
  g.lineWidth = 2; g.strokeRect(28, 28, s - 56, s - 56);
  for (let i = 0; i < 400; i++) { g.fillStyle = `rgba(0,0,0,${rnd(.05, .25)})`; g.fillRect(rnd(0, s), rnd(0, s), 2, 2); }
  blotches(g, s, 5, '10,8,5', .4, 20, 70);
};

const woodTex = makeTex(256, drawWood);
const floorTex = makeTex(256, drawWood, 4, 4.8);
const wallTex = makeTex(256, drawWall);
const rugTex = makeTex(256, drawRug);

const mat = (map, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ map, bumpMap: map, bumpScale: 0.8, roughness: 0.9, metalness: 0 }, o));
const floorMat = mat(floorTex, { roughness: .8 });
const woodMat = mat(woodTex);
const plainMat = c => new THREE.MeshStandardMaterial({ color: c, roughness: .95 });

/* ---------- physics world (cannon-es) ---------- */
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
world.defaultContactMaterial.friction = 0;
world.defaultContactMaterial.restitution = 0;
world.allowSleep = false;

const W = 10, D = 12, H = 3.2;   // room size (x, z, y)

function physBox(x, y, z, w, h, d, ry = 0) {
  const b = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(w / 2, h / 2, d / 2)), position: new CANNON.Vec3(x, y, z) });
  b.quaternion.setFromEuler(0, ry, 0);
  world.addBody(b); return b;
}
function addBox(x, y, z, w, h, d, material, ry = 0, physics = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  m.position.set(x, y, z); m.rotation.y = ry; m.castShadow = m.receiveShadow = true;
  scene.add(m);
  if (physics) physBox(x, y, z, w, h, d, ry);
  return m;
}

// floor + ceiling + walls (colliders)
const floorBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
world.addBody(floorBody);
physBox(0, H + .5, 0, W + 2, 1, D + 2);
physBox(0, H / 2, -D / 2 - .5, W + 2, H + 2, 1);
physBox(0, H / 2,  D / 2 + .5, W + 2, H + 2, 1);
physBox(-W / 2 - .5, H / 2, 0, 1, H + 2, D + 2);
physBox( W / 2 + .5, H / 2, 0, 1, H + 2, D + 2);

// visual room surfaces
function plane(w, h, material, pos, rot) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), material);
  m.position.set(...pos); m.rotation.set(...rot); m.receiveShadow = true; scene.add(m); return m;
}
function wallMat(rx) {
  const t = wallTex.clone(); t.repeat.set(rx, 1); t.needsUpdate = true; return mat(t, { roughness: 1, bumpScale: 0.5 });
}
plane(W, D, floorMat, [0, 0, 0], [-Math.PI / 2, 0, 0]);
plane(W, D, wallMat(3.1), [0, H, 0], [Math.PI / 2, 0, 0]);
plane(W, H, wallMat(3.1), [0, H / 2, -D / 2], [0, 0, 0]);
plane(W, H, wallMat(3.1), [0, H / 2,  D / 2], [0, Math.PI, 0]);
plane(D, H, wallMat(3.75), [ W / 2, H / 2, 0], [0, -Math.PI / 2, 0]);
plane(D, H, wallMat(3.75), [-W / 2, H / 2, 0], [0,  Math.PI / 2, 0]);

// rug
plane(3.2, 2.2, mat(rugTex, { roughness: 1 }), [1.2, 0.012, 1.0], [-Math.PI / 2, 0, 0.3]);

/* ---------- furniture ---------- */
function table(cx, cz, w, d) {
  addBox(cx, .76, cz, w, .08, d, woodMat);
  const lx = w / 2 - .1, lz = d / 2 - .1;
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) =>
    addBox(cx + sx * lx, .36, cz + sz * lz, .08, .72, .08, woodMat));
}
const bookCols = [0x5a1f1f, 0x1f3a2a, 0x2a2a4a, 0x4a3a1f, 0x3a2a1f, 0x5a4a2a, 0x2f2f2f].map(plainMat);
const unitBox = new THREE.BoxGeometry(1, 1, 1);
function book(x, y, z, w, h, d, ry = 0, physics = true) {
  const m = new THREE.Mesh(unitBox, bookCols[(Math.random() * bookCols.length) | 0]);
  m.scale.set(w, h, d); m.position.set(x, y + h / 2, z); m.rotation.y = ry;
  m.castShadow = m.receiveShadow = true; scene.add(m);
  if (physics) physBox(x, y + h / 2, z, w, h, d, ry);
}

// tables with books and a bottle
table(-2.5, -3.5, 2.0, 1.0);
table(3.2, -3.5, 1.4, .8);
book(-2.9, .8, -3.5, .22, .05, .3, .3);
book(-2.9, .85, -3.5, .2, .04, .28, -.2);
book(-2.0, .8, -3.3, .24, .06, .32, 1.1);
book(3.0, .8, -3.4, .22, .05, .3, .6);
const bottle = new THREE.Mesh(new THREE.CylinderGeometry(.05, .06, .26, 10), new THREE.MeshStandardMaterial({ color: 0x1a3a22, roughness: .25, metalness: .1 }));
bottle.position.set(-1.7, .94, -3.7); bottle.castShadow = true; scene.add(bottle);
physBox(-1.7, .94, -3.7, .12, .26, .12);

// chair
addBox(3.2, .45, -2.5, .45, .05, .45, woodMat);
addBox(3.2, .8, -2.27, .45, .6, .05, woodMat);
[[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => addBox(3.2 + sx * .19, .21, -2.5 + sz * .19, .05, .42, .05, woodMat));

// bookshelf against the north wall
const sx = .5, sz = -5.75;
physBox(sx, 1.1, sz, 2.0, 2.2, .5);
addBox(sx, 1.1, -5.97, 2.0, 2.2, .04, woodMat, 0, false);
addBox(sx - .98, 1.1, sz, .04, 2.2, .5, woodMat, 0, false);
addBox(sx + .98, 1.1, sz, .04, 2.2, .5, woodMat, 0, false);
[.04, .6, 1.15, 1.7, 2.2].forEach(y => addBox(sx, y, sz, 2.0, .04, .5, woodMat, 0, false));
[.06, .62, 1.17, 1.72].forEach(y => {
  let x = sx - .9;
  while (x < sx + .85) {
    if (Math.random() < .12) { x += rnd(.1, .3); continue; }
    const bw = rnd(.04, .09), bh = rnd(.26, .44);
    book(x + bw / 2, y, -5.68, bw, bh, .27, 0, false);
    x += bw + .005;
  }
});

// crates
addBox(-4.2, .4, 3.5, .8, .8, .8, woodMat, .1);
addBox(-4.2, .4, 4.45, .8, .8, .8, woodMat, -.05);
addBox(-4.15, 1.2, 3.55, .7, .7 * 1.14, .7, woodMat, .5);

// barrel
const barrel = new THREE.Mesh(new THREE.CylinderGeometry(.38, .34, 1, 14), woodMat);
barrel.position.set(4.2, .5, -.8); barrel.castShadow = barrel.receiveShadow = true; scene.add(barrel);
physBox(4.2, .5, -.8, .7, 1, .7);

// stack of books on the floor
book(0.2, 0, 2.6, .5, .08, .36, .4);
book(0.22, .08, 2.6, .46, .07, .34, .1);
book(0.18, .15, 2.62, .42, .06, .3, .7);
book(-1.4, 0, 3.4, .36, .12, .26, 1.3);
book(2.0, 0, 3.0, .3, .09, .22, .2);

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0x303848, 0x100c08, 0.18));   // faint ambient so it's not pure black

// faint moonlit window on the east wall
const win = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1.4),
  new THREE.MeshBasicMaterial({ color: 0x1a2a44 }));
win.position.set(W / 2 - .01, 1.8, -1.8); win.rotation.y = -Math.PI / 2; scene.add(win);
const moon = new THREE.PointLight(0x5577aa, 3, 7, 2);
moon.position.set(W / 2 - .6, 1.8, -1.8); scene.add(moon);

// flashlight
const FL_ANGLE = 0.46, FL_BASE = 90;
const flash = new THREE.SpotLight(0xffe9c4, FL_BASE, 15, FL_ANGLE, 0.55, 2);
flash.castShadow = true;
flash.shadow.mapSize.set(isTouch ? 512 : 1024, isTouch ? 512 : 1024);
flash.shadow.camera.near = 0.1; flash.shadow.camera.far = 15;
flash.shadow.bias = -0.0004; flash.shadow.normalBias = 0.02;
flash.position.set(0.22, -0.18, 0);
flash.target.position.set(0, -0.05, -6);
camera.add(flash); camera.add(flash.target);

/* ---------- floating dust (custom GLSL shader) ---------- */
const DUST = isTouch ? 500 : 900;
const dPos = new Float32Array(DUST * 3), dSeed = new Float32Array(DUST);
for (let i = 0; i < DUST; i++) {
  dPos[i * 3] = rnd(-4.8, 4.8); dPos[i * 3 + 1] = rnd(.1, 3.1); dPos[i * 3 + 2] = rnd(-5.8, 5.8); dSeed[i] = Math.random();
}
const dGeo = new THREE.BufferGeometry();
dGeo.setAttribute('position', new THREE.BufferAttribute(dPos, 3));
dGeo.setAttribute('aSeed', new THREE.BufferAttribute(dSeed, 1));
const dustMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: {
    uTime: { value: 0 }, uScale: { value: 1 }, uPos: { value: new THREE.Vector3() },
    uDir: { value: new THREE.Vector3(0, 0, -1) }, uCos: { value: Math.cos(FL_ANGLE * .9) }, uOn: { value: 1 }
  },
  vertexShader: /* glsl */`
    uniform float uTime; uniform float uScale;
    attribute float aSeed;
    varying vec3 vW; varying float vSeed;
    void main() {
      vec3 p = position;
      p.x += sin(uTime * .15 + aSeed * 20.) * .35;
      p.y += sin(uTime * .10 + aSeed * 37.) * .25;
      p.z += cos(uTime * .12 + aSeed * 13.) * .35;
      vec4 mv = modelViewMatrix * vec4(p, 1.);
      vW = (modelMatrix * vec4(p, 1.)).xyz;
      vSeed = aSeed;
      gl_PointSize = clamp(0.035 * (1. + aSeed * 1.5) * uScale / -mv.z, 1., 14.);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */`
    precision mediump float;
    uniform float uTime, uCos, uOn; uniform vec3 uPos, uDir;
    varying vec3 vW; varying float vSeed;
    void main() {
      float r = length(gl_PointCoord - .5);
      if (r > .5) discard;
      float soft = smoothstep(.5, 0., r);
      vec3 toP = vW - uPos;
      float d = length(toP);
      float cone = smoothstep(uCos, uCos + .12, dot(toP / d, uDir));
      float att = 1. / (1. + d * d * .05);
      float tw = .6 + .4 * sin(uTime * 2. + vSeed * 50.);
      float a = soft * (.025 + cone * att * uOn * .9 * tw);
      gl_FragColor = vec4(vec3(1., .94, .78), a);
    }`
});
const dust = new THREE.Points(dGeo, dustMat);
dust.frustumCulled = false;
scene.add(dust);
function setDustScale() { dustMat.uniforms.uScale.value = innerHeight * PR / (2 * Math.tan(THREE.MathUtils.degToRad(FOV / 2))); }
setDustScale();

/* ---------- player body: 3 stacked spheres, can't pass tables or books ---------- */
const player = new CANNON.Body({ mass: 70, position: new CANNON.Vec3(3.6, 0.02, 4.6), fixedRotation: true, linearDamping: 0 });
[0.3, 0.75, 1.2].forEach(y => player.addShape(new CANNON.Sphere(0.3), new CANNON.Vec3(0, y, 0)));
player.updateMassProperties();
world.addBody(player);
let canJump = false;
const up = new CANNON.Vec3(0, 1, 0), cn = new CANNON.Vec3();
player.addEventListener('collide', e => {
  const c = e.contact;
  if (c.bi.id === player.id) c.ni.negate(cn); else cn.copy(c.ni);
  if (cn.dot(up) > 0.5) canJump = true;
});

/* ---------- input ---------- */
let yaw = 0.3, pitch = 0;
const keys = {};
let jumpReq = false, lightOn = true, runToggle = false;
const joy = { id: null, x: 0, y: 0 }, look = { id: null, x: 0, y: 0 };

function toggleLight() { lightOn = !lightOn; $('bLight').classList.toggle('on', lightOn); }
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') jumpReq = true;
  if (e.code === 'KeyF' && !e.repeat) toggleLight();
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('mousemove', e => {
  if (document.pointerLockElement !== renderer.domElement) return;
  yaw -= e.movementX * 0.0022;
  pitch = Math.max(-1.45, Math.min(1.45, pitch - e.movementY * 0.0022));
});

if (isTouch) {
  $('joy').style.display = 'block';
  ['bLight', 'bRun', 'bJump'].forEach(id => $(id).style.display = 'flex');
  $('bLight').classList.add('on');
  const press = (id, fn) => $(id).addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); fn(); }, { passive: false });
  press('bLight', toggleLight);
  press('bJump', () => jumpReq = true);
  press('bRun', () => { runToggle = !runToggle; $('bRun').classList.toggle('on', runToggle); });

  const joyEl = $('joy'), knob = $('knob');
  const setJoy = t => {
    const r = joyEl.getBoundingClientRect(), R = r.width / 2;
    let dx = (t.clientX - (r.left + R)) / R, dy = (t.clientY - (r.top + R)) / R;
    const len = Math.hypot(dx, dy); if (len > 1) { dx /= len; dy /= len; }
    joy.x = dx; joy.y = dy;
    knob.style.transform = `translate(${dx * R * .7}px, ${dy * R * .7}px)`;
  };
  addEventListener('touchstart', e => {
    if (!started) return;
    for (const t of e.changedTouches) {
      if (t.target.closest && t.target.closest('.btn')) continue;
      if (t.target.closest && t.target.closest('#joy') && joy.id === null) { joy.id = t.identifier; setJoy(t); }
      else if (look.id === null) { look.id = t.identifier; look.x = t.clientX; look.y = t.clientY; }
    }
    e.preventDefault();
  }, { passive: false });
  addEventListener('touchmove', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === joy.id) setJoy(t);
      else if (t.identifier === look.id) {
        yaw -= (t.clientX - look.x) * 0.0058;
        pitch = Math.max(-1.45, Math.min(1.45, pitch - (t.clientY - look.y) * 0.0058));
        look.x = t.clientX; look.y = t.clientY;
      }
    }
    e.preventDefault();
  }, { passive: false });
  const end = e => {
    for (const t of e.changedTouches) {
      if (t.identifier === joy.id) { joy.id = null; joy.x = joy.y = 0; knob.style.transform = ''; }
      if (t.identifier === look.id) look.id = null;
    }
  };
  addEventListener('touchend', end); addEventListener('touchcancel', end);
}

/* ---------- start / pause ---------- */
let started = false;
const overlay = $('overlay'), enter = $('enter');
function startGame() {
  started = true; overlay.style.display = 'none';
  $('hint').textContent = isTouch ? 'Find something worth finding.' : 'Esc to release the mouse.';
  $('hint').style.opacity = 1; setTimeout(() => $('hint').style.opacity = 0, 5000);
  if (isTouch) { try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); } catch (_) {} }
  else renderer.domElement.requestPointerLock();
}
enter.addEventListener('click', startGame);
document.addEventListener('pointerlockchange', () => {
  if (!isTouch && started && document.pointerLockElement !== renderer.domElement) {
    started = false; overlay.style.display = 'flex'; enter.textContent = 'Resume';
  }
});
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); setDustScale();
});

/* ---------- main loop ---------- */
const clock = new THREE.Clock();
const camDir = new THREE.Vector3();
let bob = 0, flickT = 0;

function update(dt) {
  // movement input
  let ix = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + joy.x;
  let iz = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0) - joy.y;
  const len = Math.hypot(ix, iz); if (len > 1) { ix /= len; iz /= len; }
  const sprint = keys.ShiftLeft || keys.ShiftRight || runToggle || Math.hypot(joy.x, joy.y) > 0.93;
  const speed = sprint ? 4.0 : 2.2;
  const s = Math.sin(yaw), c = Math.cos(yaw);
  const tx = (-s * iz + c * ix) * speed, tz = (-c * iz - s * ix) * speed;
  const k = 1 - Math.exp(-dt * 12);
  player.velocity.x += (tx - player.velocity.x) * k;
  player.velocity.z += (tz - player.velocity.z) * k;

  if (jumpReq && canJump) { player.velocity.y = 4.6; }
  jumpReq = false; canJump = false;
  world.step(1 / 60, dt, 4);
  if (player.position.y < -3) { player.position.set(3.6, 0.1, 4.6); player.velocity.set(0, 0, 0); }

  // camera
  const moving = Math.hypot(player.velocity.x, player.velocity.z);
  bob += moving * dt * 2.6;
  const bobY = Math.sin(bob) * 0.03 * Math.min(1, moving / 2);
  camera.position.set(player.position.x, player.position.y + 1.55 + bobY, player.position.z);
  camera.rotation.set(pitch, yaw, 0);

  // flashlight with occasional flicker
  if (flickT <= 0 && Math.random() < 0.004) flickT = 0.12;
  let f = 1; if (flickT > 0) { flickT -= dt; f = 0.3 + Math.random() * 0.5; }
  flash.intensity = lightOn ? FL_BASE * f : 0;

  // dust shader uniforms
  const u = dustMat.uniforms;
  u.uTime.value += dt;
  u.uPos.value.copy(camera.position);
  camera.getWorldDirection(camDir); u.uDir.value.copy(camDir);
  u.uOn.value = lightOn ? f : 0;
}

function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (started) update(dt);
  else { dustMat.uniforms.uTime.value += dt; }
  renderer.render(scene, camera);
}

camera.position.set(3.6, 1.57, 4.6); camera.rotation.set(0, yaw, 0);
enter.disabled = false; enter.textContent = 'Enter';
tick();
</script>
</body>
